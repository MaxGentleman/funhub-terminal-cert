<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refund Cheat Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ---------------------------------------------------------------------------
   One procedure, one page. The POS refund and the manual backup are separate
   sheets, because they are separate jobs done at separate moments — the manual
   one only exists for the day the first one fails.

   Steps run top to bottom, and a screenshot sits under the step it belongs to,
   at a size you can recognise from arm's length. Black on white, so a
   photocopy reads the same as the original.
--------------------------------------------------------------------------- */

:root{
  --paper:#ffffff;
  --ink:#16181c;
  --ink-2:#4a5058;
  --ink-3:#7c828b;
  --rule:#c9cdd4;
  --rule-2:#e6e8ec;
  --band:#f2f3f5;
  --go:#0b6b3a;
  --fallback:#8a4b08;
  --stop:#a81e1e;

  --app-bg:#eceef1;
  --app-ink:#20242a;
  --app-ink-2:#5a616a;
  --app-line:#d3d7dd;
  --app-surface:#ffffff;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --app-bg:#14171b; --app-ink:#e8eaee; --app-ink-2:#9aa1ab;
    --app-line:#2c3138; --app-surface:#1c2026;
  }
}
:root[data-theme="dark"]{
  --app-bg:#14171b; --app-ink:#e8eaee; --app-ink-2:#9aa1ab;
  --app-line:#2c3138; --app-surface:#1c2026;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--app-bg); color:var(--app-ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ------------------------------------------------------------------ chrome */
.chrome{
  position:sticky; top:0; z-index:10; background:var(--app-surface);
  border-bottom:1px solid var(--app-line); padding:11px clamp(12px,3vw,26px);
  display:flex; flex-direction:column; gap:9px;
}
.crow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.chrome h1{
  margin:0; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; font-weight:700; letter-spacing:-.01em; white-space:nowrap;
}
.chrome h1 span{display:block; font-size:11px; font-weight:500; color:var(--app-ink-2)}
.pickrow{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.plabel{
  font:600 10px/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--app-ink-2); min-width:52px;
}
.chip{
  font:600 13px/1.25 "IBM Plex Sans",Arial,sans-serif; color:var(--app-ink-2);
  background:transparent; border:1px solid var(--app-line); border-radius:999px;
  padding:7px 14px; cursor:pointer; text-align:left;
}
.chip small{display:block; font:500 10.5px/1.3 "IBM Plex Mono",monospace; opacity:.8}
.chip:hover{color:var(--app-ink)}
.chip[aria-pressed="true"]{background:var(--app-ink); border-color:var(--app-ink); color:var(--app-surface)}
.chip.pick[aria-pressed="true"]{background:var(--go); border-color:var(--go); color:#fff}
.chip.pick.man[aria-pressed="true"]{background:var(--fallback); border-color:var(--fallback)}
.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--go); outline-offset:2px}
.spacer{margin-left:auto}
.seg{display:inline-flex; border:1px solid var(--app-line); border-radius:8px; overflow:hidden}
.seg button{
  font:600 12px/1 "IBM Plex Mono",monospace; padding:8px 11px;
  background:transparent; color:var(--app-ink-2); border:0; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--app-ink); color:var(--app-surface)}
.btn{
  font:600 13px/1 "IBM Plex Sans",Arial,sans-serif; padding:9px 15px;
  border-radius:8px; border:1px solid var(--app-line); background:transparent;
  color:var(--app-ink); cursor:pointer;
}
.btn.primary{background:var(--go); border-color:var(--go); color:#fff}
.btn:hover{border-color:var(--app-ink-2)}
.btn.primary:hover{background:#095a30}
.hint{
  padding:8px clamp(12px,3vw,26px); font-size:12px; color:var(--app-ink-2);
  background:var(--app-surface); border-bottom:1px solid var(--app-line); margin:0;
}

/* ------------------------------------------------------------------- paper */
.stack{padding:20px clamp(8px,3vw,26px) 60px; display:flex; flex-direction:column; align-items:center; gap:20px}
.sheet{
  width:216mm; max-width:100%;
  background:var(--paper); color:var(--ink);
  padding:12mm 12mm 10mm;
  box-shadow:0 1px 2px rgba(0,0,0,.10), 0 10px 30px rgba(0,0,0,.12);
  display:none; flex-direction:column;
  font-size:11pt; line-height:1.34;
}
.sheet.active{display:flex; height:279mm}

/* masthead ---------------------------------------------------------------- */
.mast{display:flex; align-items:flex-start; gap:14px; padding-bottom:6px; border-bottom:3px solid var(--ink)}
.mast.man{border-bottom-color:var(--fallback)}
.eyebrow{
  font:600 8.4pt/1 "IBM Plex Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
}
.mast.man .eyebrow{color:var(--fallback)}
.mast h2{
  margin:3px 0 0; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:26pt; font-weight:700; line-height:.95; letter-spacing:-.02em;
}
.mast .sub{margin:4px 0 0; font-size:9.8pt; color:var(--ink-2); max-width:118mm}
.mast-r{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:4px; align-items:flex-end}
.storecode{
  font-family:Archivo,sans-serif; font-size:19pt; font-weight:700; line-height:1;
  border:2.5px solid var(--ink); border-radius:3px; padding:2px 9px;
}
.kit{font:500 8.6pt/1.3 "IBM Plex Mono",monospace; color:var(--ink-2); max-width:58mm}

.applies{
  margin-top:7px; padding:6px 10px; border-left:3px solid var(--go); background:#f1f6f3;
  font-size:9.8pt; line-height:1.34;
}
.applies.back{border-left-color:var(--fallback); background:#faf5ef}

/* steps: one column, top to bottom, picture under its own step ------------- */
.steps{margin-top:7px; display:flex; flex-direction:column; gap:6px}
.step{display:grid; grid-template-columns:auto 1fr; gap:0 9px; break-inside:avoid}
.step .n{
  font-family:Archivo,sans-serif; font-weight:700; font-size:9.6pt; line-height:1;
  width:19px; height:19px; border-radius:50%; background:var(--ink); color:#fff;
  display:grid; place-items:center; margin-top:1px; font-variant-numeric:tabular-nums;
}
.man .step .n{background:var(--fallback)}
.after .step .n{background:var(--ink-2)}
.step p{margin:0; align-self:center}
.shot{grid-column:2; margin-top:5px}
.shot img{
  display:block; width:auto; height:auto; max-width:30em; max-height:14em;
  border:1px solid var(--rule); background:#fff;
}

.trap{
  break-inside:avoid; margin-top:8px; padding:6px 9px 6px 10px;
  border-left:3px solid var(--stop); background:#fbf3f3;
}
.trap .lbl{
  font:600 8pt/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--stop); display:block; margin-bottom:3px;
}
.after{break-inside:avoid; margin-top:8px; padding:7px 10px; background:var(--band); border-left:3px solid var(--ink-2)}
.after .lbl{
  font:600 8pt/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-2); display:block; margin-bottom:3px;
}
.after .steps{margin-top:5px; gap:4px}
.next{
  margin-top:8px; padding:7px 10px; border:1px dashed var(--rule);
  font-size:9.8pt; line-height:1.34; color:var(--ink-2);
}
.next b,.next strong{color:var(--ink)}

/* every-refund rules, identical on every sheet on purpose ------------------ */
.rules{margin-top:auto; padding-top:8px; border-top:3px solid var(--ink)}
.rules-h{
  font:600 8.4pt/1 "IBM Plex Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:5px;
}
.rules ol{margin:0; padding:0; list-style:none; counter-reset:r; display:grid; grid-template-columns:repeat(4,1fr); gap:0 6mm}
.rules li{font-size:9.2pt; line-height:1.3; padding-left:13px; position:relative}
.rules li::before{
  content:counter(r); counter-increment:r; position:absolute; left:0; top:0;
  font:600 8pt/1.5 "IBM Plex Mono",monospace; color:var(--ink-3);
}
.foot{
  display:flex; gap:10px; align-items:baseline; margin-top:7px;
  font:500 8pt/1.3 "IBM Plex Mono",monospace; color:var(--ink-3);
}
.foot .r{margin-left:auto}

.ui{
  font-family:"IBM Plex Mono",monospace; font-size:.92em; font-weight:500;
  background:var(--band); border:1px solid var(--rule-2); border-radius:3px;
  padding:.5px 3.5px; white-space:nowrap;
}
strong{font-weight:600}

/* ------------------------------------------------------------------- print */
@page{size:letter portrait; margin:11mm}
@media print{
  :root{--app-bg:#fff}
  body{background:#fff}
  .chrome,.hint{display:none !important}
  .stack{padding:0; gap:0; display:block}
  .sheet{
    display:flex !important; width:auto; max-width:none; height:auto;
    padding:0; box-shadow:none; break-after:page; page-break-after:always;
  }
  .sheet.active{height:auto}
  .sheet:last-of-type{break-after:auto; page-break-after:auto}
  body.print-one .sheet:not(.active){display:none !important}
  body.print-one .sheet.active{break-after:auto; page-break-after:auto}
  body.print-store .sheet:not(.in-store){display:none !important}
  body.print-store .sheet.in-store:last-of-type{break-after:auto; page-break-after:auto}
  .applies,.trap,.after,.next,.ui,.step .n,.storecode,.shot img{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<header class="chrome">
  <div class="crow">
    <h1>Refund cheat sheets<span id="brand-sub">FUNHUB</span></h1>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-fr" aria-pressed="false">FR</button>
    </div>
    <button class="btn primary" id="print-one">Save as PDF</button>
    <button class="btn" id="print-store">Print this store</button>
  </div>
  <div class="pickrow"><span class="plabel" id="lbl-store">Store</span><span id="stores"></span></div>
  <div class="pickrow"><span class="plabel" id="lbl-sheet">Sheet</span><span id="picks"></span></div>
</header>
<p class="hint" id="hint"></p>

<main class="stack" id="stack"></main>

/* ---- what each store actually has ---------------------------------------- */
var LAYOUT = [
  { store:"03", pos:"Midori",    kit:"Clover Flex · Clover Mini", proc:MIDORI,    manual:CLOVER,  after:MIDORI_AFTER },
  { store:"03", pos:"MYR",       kit:"Moneris Go Plus",           proc:MYR,       manual:MONERIS },
  { store:"03", pos:"Intercard", kit:"Moneris P400",              proc:INTERCARD, manual:null },
  { store:"07", pos:"Midori",    kit:"Moneris Go",                proc:MIDORI,    manual:MONERIS, after:MIDORI_AFTER },
  { store:"07", pos:"Cluster",   kit:"Moneris Go Plus",           proc:CLUSTER,   manual:MONERIS },
  { store:"07", pos:"Embed",     kit:"Windcave LANE3600",         proc:EMBED,     manual:null },
  { store:"11", pos:"Midori",    kit:"Moneris Go",                proc:MIDORI,    manual:MONERIS, after:MIDORI_AFTER },
  { store:"11", pos:"MYR",       kit:"Moneris Go Plus",           proc:MYR,       manual:MONERIS },
  { store:"11", pos:"Embed",     kit:"Windcave LANE3600",         proc:EMBED,     manual:null },
  { store:"HO", pos:"Embed",     kit:"Windcave CHU200S",          proc:EMBED,     manual:null }
];

/* Each entry becomes a POS sheet, plus a manual sheet where one exists. */
var SHEETS = [];
LAYOUT.forEach(function(L){
  SHEETS.push({ id:L.store+"-"+L.pos+"-pos", kind:"pos", store:L.store, pos:L.pos, src:L });
  if(L.manual) SHEETS.push({ id:L.store+"-"+L.pos+"-man", kind:"man", store:L.store, pos:L.pos, src:L });
});

var RULES = {
  en:[ "Refund to the **same card** the customer paid with. Never another card, never cash.",
       "Print the receipt. The customer **signs the merchant copy**.",
       "The signed merchant copy goes in the **nightly deposit**.",
       "The customer keeps **their own copy**." ],
  fr:[ "Remboursez sur la **même carte** que le paiement. Jamais une autre, jamais comptant.",
       "Imprimez le reçu. Le client **signe la copie marchand**.",
       "La copie marchand signée va au **dépôt de fin de journée**.",
       "Le client garde **sa propre copie**." ]
};

/* ------------------------------------------------------------------ render */
var lang = "en", store = "03", sheet = "03-Midori-pos";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="ui">$1</span>')
               .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function t(k){ return UI[lang][k]; }
function txt(v){ return typeof v === "string" ? v : v[lang]; }
function forStore(c){ return SHEETS.filter(function(S){ return S.store === c; }); }
function storeName(c){
  for(var i=0;i<STORES.length;i++) if(STORES[i].code===c) return txt(STORES[i].name);
  return c;
}
function fill(s, vals){ return s.replace(/\{(\w+)\}/g, function(_, k){ return vals[k]; }); }

/* Steps run top to bottom, and the picture for a step sits under that step. */
function steps(list, shots){
  return '<div class="steps">' + list.map(function(s, i){
    var n = i + 1, k = shots && shots[n], img = k && FIG[k];
    return '<div class="step"><span class="n">' + n + '</span><p>' + fmt(s) + '</p>'
         + (img ? '<div class="shot"><img src="' + img + '" alt=""></div>' : '')
         + '</div>';
  }).join("") + '</div>';
}
function trap(v){
  return '<div class="trap"><span class="lbl">' + esc(t("trap")) + '</span>' + fmt(txt(v)) + '</div>';
}

function sheetHtml(S){
  var L = S.src, man = S.kind === "man", P = L.proc, M = L.manual;
  var h = '<section class="sheet' + (man ? " man" : "") + (S.id === sheet ? " active" : "")
        + (S.store === store ? " in-store" : "") + '" id="sheet-' + S.id + '">';

  h += '<div class="mast' + (man ? " man" : "") + '"><div>'
     + '<div class="eyebrow">' + esc(man ? t("manEyebrow") : t("posEyebrow")) + ' · ' + esc(storeName(S.store)) + '</div>'
     + '<h2>' + esc(man ? M.name : S.pos) + '</h2>'
     + (man ? '<p class="sub">' + esc(fill(t("manSub"), { pos:S.pos })) + '</p>' : '')
     + '</div><div class="mast-r"><span class="storecode">' + esc(S.store) + '</span>'
     + '<span class="kit">' + esc(man ? S.pos : L.kit) + '</span></div></div>';

  if(man){
    h += '<div class="applies back">' + fmt(fill(t("backPos"), { pos:S.pos })) + '</div>'
       + steps(M.steps[lang], M.shots)
       + trap(M.trap);
    if(L.after){
      h += '<div class="after"><span class="lbl">' + esc(t("after")) + '</span>'
         + '<p style="margin:0;color:var(--ink-2)">' + esc(txt(L.after.note)) + '</p>'
         + steps(L.after.steps[lang], null) + '</div>';
    }
  } else {
    h += (P.applies ? '<div class="applies">' + fmt(txt(P.applies)) + '</div>' : '')
       + steps(P.steps[lang], P.shots)
       + (P.trap ? trap(P.trap) : '')
       + '<div class="next">' + (M ? fmt(fill(t("nextMan"), { kit:M.name })) : fmt(txt(P.noManual))) + '</div>';
  }

  h += '<div class="rules"><div class="rules-h">' + esc(t("rules")) + '</div><ol>'
     + RULES[lang].map(function(r){ return '<li>' + fmt(r) + '</li>'; }).join("")
     + '</ol><div class="foot"><span>' + esc(t("foot")) + '</span>'
     + '<span class="r">' + esc(S.store) + ' · ' + esc(S.pos) + ' · '
     + esc(man ? t("manPick") : t("posPick")) + ' · ' + esc(t("rev")) + '</span></div></div>';

  return h + '</section>';
}

/* Grow the type and the pictures together until the sheet nearly fills the
   paper, capped so nothing ever spills onto a second page. */
function fit(){
  var page = 279 * 3.7795;
  SHEETS.forEach(function(S){
    var el = document.getElementById("sheet-" + S.id);
    if(!el) return;
    el.style.height = "auto";      /* the footer's auto margin hides overflow */
    var best = 9;
    for(var size = 13; size >= 9; size -= 0.2){
      el.style.fontSize = size + "pt";
      if(el.offsetHeight <= page * 0.985){ best = size; break; }
    }
    el.style.fontSize = best + "pt";
    el.style.height = "";
  });
}

function render(){
  document.documentElement.lang = lang;
  if(!forStore(store).some(function(S){ return S.id === sheet; })) sheet = forStore(store)[0].id;

  document.getElementById("hint").textContent = t("hint");
  document.getElementById("lbl-store").textContent = t("store");
  document.getElementById("lbl-sheet").textContent = t("sheet");
  document.getElementById("print-one").textContent = t("saveOne");
  document.getElementById("print-store").textContent = t("printStore") + " (" + forStore(store).length + ")";
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("lang-fr").setAttribute("aria-pressed", lang === "fr");

  document.getElementById("stores").innerHTML = STORES.map(function(S){
    return '<button class="chip st" data-store="' + S.code + '" aria-pressed="' + (S.code === store) + '">'
         + esc(S.code) + ' · ' + esc(txt(S.name)) + '</button>';
  }).join(" ");
  document.getElementById("picks").innerHTML = forStore(store).map(function(S){
    return '<button class="chip pick' + (S.kind === "man" ? " man" : "") + '" data-sheet="' + S.id
         + '" aria-pressed="' + (S.id === sheet) + '">' + esc(S.pos)
         + '<small>' + esc(S.kind === "man" ? t("manPick") : t("posPick")) + '</small></button>';
  }).join(" ");

  var stack = document.getElementById("stack");
  stack.innerHTML = SHEETS.map(sheetHtml).join("");

  var all = stack.querySelectorAll(".sheet");
  all.forEach(function(el){ el.classList.add("active"); });
  fit();
  all.forEach(function(el){ if(el.id !== "sheet-" + sheet) el.classList.remove("active"); });
}

function print(mode){
  document.body.classList.remove("print-one", "print-store");
  if(mode) document.body.classList.add(mode);
  window.print();
  setTimeout(function(){ document.body.classList.remove("print-one", "print-store"); }, 0);
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("button");
  if(!el) return;
  if(el.dataset.store){ store = el.dataset.store; render(); window.scrollTo(0, 0); return; }
  if(el.dataset.sheet){ sheet = el.dataset.sheet; render(); window.scrollTo(0, 0); return; }
  if(el.id === "lang-en"){ lang = "en"; render(); return; }
  if(el.id === "lang-fr"){ lang = "fr"; render(); return; }
  if(el.id === "print-one"){ print("print-one"); return; }
  if(el.id === "print-store"){ print("print-store"); return; }
});
window.addEventListener("afterprint", function(){
  document.body.classList.remove("print-one", "print-store");
});

render();
</script>
