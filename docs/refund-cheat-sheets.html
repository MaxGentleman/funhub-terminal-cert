<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refund Sheet Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style id="app-css">
/* ---------------------------------------------------------------------------
   A builder for the printed sheets, not just the sheets. Drag a screenshot from
   the rail onto a step, drag its handle to size it, and save — the page keeps
   its own layout, so the next person to open it sees what you left.

   Everything to the right of the paper is editing furniture and disappears when
   you print. The paper itself stays black on white so a photocopy reads the
   same as the original.
--------------------------------------------------------------------------- */

:root{
  --paper:#ffffff;
  --ink:#16181c;
  --ink-2:#4a5058;
  --ink-3:#7c828b;
  --rule:#c9cdd4;
  --rule-2:#e6e8ec;
  --band:#f2f3f5;
  --go:#0b6b3a;
  --fallback:#8a4b08;
  --stop:#a81e1e;

  --app-bg:#eceef1;
  --app-ink:#20242a;
  --app-ink-2:#5a616a;
  --app-line:#d3d7dd;
  --app-surface:#ffffff;
  --app-sunk:#f5f6f8;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --app-bg:#14171b; --app-ink:#e8eaee; --app-ink-2:#9aa1ab;
    --app-line:#2c3138; --app-surface:#1c2026; --app-sunk:#22272e;
  }
}
:root[data-theme="dark"]{
  --app-bg:#14171b; --app-ink:#e8eaee; --app-ink-2:#9aa1ab;
  --app-line:#2c3138; --app-surface:#1c2026; --app-sunk:#22272e;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--app-bg); color:var(--app-ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ------------------------------------------------------------------ chrome */
.chrome{
  position:sticky; top:0; z-index:20; background:var(--app-surface);
  border-bottom:1px solid var(--app-line); padding:10px clamp(12px,2.5vw,22px);
  display:flex; flex-direction:column; gap:8px;
}
.crow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.chrome h1{
  margin:0; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; font-weight:700; letter-spacing:-.01em; white-space:nowrap;
}
.chrome h1 span{display:block; font-size:11px; font-weight:500; color:var(--app-ink-2)}
.pickrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.plabel{
  font:600 10px/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--app-ink-2); min-width:52px;
}
.chip{
  font:600 12.5px/1.25 "IBM Plex Sans",Arial,sans-serif; color:var(--app-ink-2);
  background:transparent; border:1px solid var(--app-line); border-radius:999px;
  padding:6px 13px; cursor:pointer; text-align:left;
}
.chip small{display:block; font:500 10px/1.3 "IBM Plex Mono",monospace; opacity:.8}
.chip:hover{color:var(--app-ink)}
.chip[aria-pressed="true"]{background:var(--app-ink); border-color:var(--app-ink); color:var(--app-surface)}
.chip.pick[aria-pressed="true"]{background:var(--go); border-color:var(--go); color:#fff}
.chip.pick.man[aria-pressed="true"]{background:var(--fallback); border-color:var(--fallback)}
.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible,.thumb:focus-visible{outline:2px solid var(--go); outline-offset:2px}
.spacer{margin-left:auto}
.seg{display:inline-flex; border:1px solid var(--app-line); border-radius:8px; overflow:hidden}
.seg button{
  font:600 12px/1 "IBM Plex Mono",monospace; padding:7px 10px;
  background:transparent; color:var(--app-ink-2); border:0; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--app-ink); color:var(--app-surface)}
.btn{
  font:600 12.5px/1 "IBM Plex Sans",Arial,sans-serif; padding:8px 14px;
  border-radius:8px; border:1px solid var(--app-line); background:transparent;
  color:var(--app-ink); cursor:pointer; white-space:nowrap;
}
.btn.primary{background:var(--go); border-color:var(--go); color:#fff}
.btn:hover{border-color:var(--app-ink-2)}
.btn.primary:hover{background:#095a30}
.btn[disabled]{opacity:.5; pointer-events:none}
.savenote{font:500 12px/1 "IBM Plex Mono",monospace; color:var(--app-ink-2)}
.savenote.ok{color:var(--go)} .savenote.err{color:var(--stop)}

/* ------------------------------------------------------------------ shell */
.shell{display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px;
  padding:16px clamp(8px,2.5vw,22px) 60px; align-items:start}
@media (max-width:1180px){ .shell{grid-template-columns:minmax(0,1fr)} .rail{display:none} }

.sheetwrap{display:flex; flex-direction:column; align-items:center; gap:10px}
.sheetbar{
  width:216mm; max-width:100%; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--app-surface); border:1px solid var(--app-line); border-radius:10px;
  padding:8px 12px; font-size:12.5px;
}
.sheetbar .lbl{font:600 10px/1 "IBM Plex Mono",monospace; letter-spacing:.11em;
  text-transform:uppercase; color:var(--app-ink-2)}
.sheetbar input[type=range]{width:120px; accent-color:var(--go)}
.fitbadge{
  margin-left:auto; font:600 11.5px/1 "IBM Plex Mono",monospace;
  padding:5px 9px; border-radius:999px; border:1px solid var(--app-line);
}
.fitbadge.ok{color:var(--go); border-color:var(--go)}
.fitbadge.over{color:var(--stop); border-color:var(--stop)}

/* ------------------------------------------------------------------- paper */
.sheet{
  width:216mm; max-width:100%;
  background:var(--paper); color:var(--ink);
  padding:12mm 12mm 10mm;
  box-shadow:0 1px 2px rgba(0,0,0,.10), 0 10px 30px rgba(0,0,0,.12);
  display:none; flex-direction:column;
  font-size:11pt; line-height:1.34;
}
.sheet.active{display:flex; min-height:279mm}

.mast{display:flex; align-items:flex-start; gap:14px; padding-bottom:6px; border-bottom:3px solid var(--ink)}
.mast.man{border-bottom-color:var(--fallback)}
.eyebrow{
  font:600 8.4pt/1 "IBM Plex Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
}
.mast.man .eyebrow{color:var(--fallback)}
.mast h2{
  margin:3px 0 0; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:26pt; font-weight:700; line-height:.95; letter-spacing:-.02em;
}
.mast .sub{margin:4px 0 0; font-size:9.8pt; color:var(--ink-2); max-width:118mm}
.mast-r{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:4px; align-items:flex-end}
.storecode{
  font-family:Archivo,sans-serif; font-size:19pt; font-weight:700; line-height:1;
  border:2.5px solid var(--ink); border-radius:3px; padding:2px 9px;
}
.kit{font:500 8.6pt/1.3 "IBM Plex Mono",monospace; color:var(--ink-2); max-width:58mm}

.applies{
  margin-top:7px; padding:6px 10px; border-left:3px solid var(--go); background:#f1f6f3;
  font-size:9.8pt; line-height:1.34;
}
.applies.back{border-left-color:var(--fallback); background:#faf5ef}

.steps{margin-top:7px; display:flex; flex-direction:column; gap:6px}
.step{display:grid; grid-template-columns:auto 1fr; gap:0 9px; break-inside:avoid; position:relative}
.step .n{
  font-family:Archivo,sans-serif; font-weight:700; font-size:9.6pt; line-height:1;
  width:19px; height:19px; border-radius:50%; background:var(--ink); color:#fff;
  display:grid; place-items:center; margin-top:1px; font-variant-numeric:tabular-nums;
}
.man .step .n{background:var(--fallback)}
.after .step .n{background:var(--ink-2)}
.step p{margin:0; align-self:center}
.shot{grid-column:2; margin-top:5px; position:relative; display:block}
.shot img{display:block; width:55%; height:auto; border:1px solid var(--rule); background:#fff}

/* editing furniture — none of this prints -------------------------------- */
.step.drop{outline:2px dashed var(--go); outline-offset:3px; border-radius:4px}
.shot .tools{
  position:absolute; left:0; top:100%; margin-top:3px; display:none; gap:6px;
  align-items:center; background:var(--app-surface); border:1px solid var(--app-line);
  border-radius:8px; padding:4px 8px; z-index:5; box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.shot:hover .tools, .shot.armed .tools{display:flex}
.shot .tools input[type=range]{width:96px; accent-color:var(--go)}
.shot .tools span{font:600 10.5px/1 "IBM Plex Mono",monospace; color:var(--app-ink-2); min-width:34px}
.shot .tools button{
  font:600 11px/1 "IBM Plex Sans",Arial,sans-serif; border:1px solid var(--app-line);
  background:transparent; color:var(--app-ink); border-radius:6px; padding:4px 7px; cursor:pointer;
}
.slot{
  grid-column:2; margin-top:4px; border:1px dashed var(--rule); border-radius:6px;
  padding:5px 8px; font:500 9pt/1.3 "IBM Plex Sans",Arial,sans-serif; color:var(--ink-3);
  cursor:default; background:var(--app-sunk);
}
.step.drop .slot{border-color:var(--go); color:var(--go)}
/* the empty-step placeholders are editing furniture and never print, so the
   page-fit measurement has to ignore them too */
.sheet.measuring .slot, .sheet.measuring .tools{display:none !important}

.trap{
  break-inside:avoid; margin-top:8px; padding:6px 9px 6px 10px;
  border-left:3px solid var(--stop); background:#fbf3f3;
}
.trap .lbl{
  font:600 8pt/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--stop); display:block; margin-bottom:3px;
}
.after{break-inside:avoid; margin-top:8px; padding:7px 10px; background:var(--band); border-left:3px solid var(--ink-2)}
.after .lbl{
  font:600 8pt/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-2); display:block; margin-bottom:3px;
}
.after .steps{margin-top:5px; gap:4px}
.next{
  margin-top:8px; padding:7px 10px; border:1px dashed var(--rule);
  font-size:9.8pt; line-height:1.34; color:var(--ink-2);
}
.next b,.next strong{color:var(--ink)}

.rules{margin-top:auto; padding-top:8px; border-top:3px solid var(--ink)}
.rules-h{
  font:600 8.4pt/1 "IBM Plex Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:5px;
}
.rules ol{margin:0; padding:0; list-style:none; counter-reset:r; display:grid; grid-template-columns:repeat(4,1fr); gap:0 6mm}
.rules li{font-size:9.2pt; line-height:1.3; padding-left:13px; position:relative}
.rules li::before{
  content:counter(r); counter-increment:r; position:absolute; left:0; top:0;
  font:600 8pt/1.5 "IBM Plex Mono",monospace; color:var(--ink-3);
}
.foot{
  display:flex; gap:10px; align-items:baseline; margin-top:7px;
  font:500 8pt/1.3 "IBM Plex Mono",monospace; color:var(--ink-3);
}
.foot .r{margin-left:auto}

.ui{
  font-family:"IBM Plex Mono",monospace; font-size:.92em; font-weight:500;
  background:var(--band); border:1px solid var(--rule-2); border-radius:3px;
  padding:.5px 3.5px; white-space:nowrap;
}
strong{font-weight:600}

/* -------------------------------------------------------------------- rail */
.rail{
  position:sticky; top:104px; background:var(--app-surface); border:1px solid var(--app-line);
  border-radius:12px; overflow:hidden; max-height:calc(100vh - 130px); display:flex; flex-direction:column;
}
.rail-h{padding:11px 13px; border-bottom:1px solid var(--app-line)}
.rail-h b{display:block; font:700 13px/1.3 Archivo,Arial,sans-serif}
.rail-h span{display:block; font-size:11.5px; color:var(--app-ink-2); margin-top:2px}
.dropzone{
  margin:11px 13px 0; border:1.5px dashed var(--app-line); border-radius:10px;
  padding:14px 10px; text-align:center; font-size:12px; color:var(--app-ink-2); cursor:pointer;
}
.dropzone.over{border-color:var(--go); color:var(--go); background:rgba(11,107,58,.06)}
.lib{overflow-y:auto; padding:11px 13px 14px; display:flex; flex-direction:column; gap:12px}
.libgroup > .gh{
  font:600 10px/1 "IBM Plex Mono",monospace; letter-spacing:.1em; text-transform:uppercase;
  color:var(--app-ink-2); margin-bottom:6px;
}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.thumb{
  border:1px solid var(--app-line); border-radius:8px; overflow:hidden; cursor:grab;
  background:var(--app-sunk); padding:0; display:flex; flex-direction:column;
}
.thumb:active{cursor:grabbing}
.thumb img{width:100%; height:62px; object-fit:contain; background:#fff; display:block}
.thumb .cap{font:600 9.5px/1.25 "IBM Plex Mono",monospace; color:var(--app-ink-2); padding:4px 5px; text-align:left}
.thumb.used{outline:2px solid var(--go); outline-offset:-2px}
.thumb .del{position:absolute}
.libnote{font-size:11.5px; color:var(--app-ink-2); line-height:1.4}

/* ------------------------------------------------------------------- print */
@page{size:letter portrait; margin:11mm}
@media print{
  :root{--app-bg:#fff}
  body{background:#fff}
  .chrome,.rail,.sheetbar,.slot,.tools{display:none !important}
  .shell{display:block; padding:0}
  .sheetwrap{display:block; gap:0}
  .sheet{
    display:flex !important; width:auto; max-width:none; min-height:0;
    padding:0; box-shadow:none; break-after:page; page-break-after:always;
  }
  /* .sheet.active carries the on-screen page-height floor and outranks .sheet,
     so it has to be released here or every sheet prints onto two pages */
  .sheet.active{min-height:0}
  .sheet:last-of-type{break-after:auto; page-break-after:auto}
  body.print-one .sheet:not(.active){display:none !important}
  body.print-one .sheet.active{break-after:auto; page-break-after:auto}
  body.print-store .sheet:not(.in-store){display:none !important}
  body.print-store .sheet.in-store:last-of-type{break-after:auto; page-break-after:auto}
  .applies,.trap,.after,.next,.ui,.step .n,.storecode,.shot img{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<header class="chrome">
  <div class="crow">
    <h1>Refund sheet builder<span id="brand-sub">FUNHUB</span></h1>
    <div class="spacer"></div>
    <span class="savenote" id="savenote"></span>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-fr" aria-pressed="false">FR</button>
    </div>
    <button class="btn" id="save" hidden>Save</button>
    <button class="btn primary" id="print-one">Save as PDF</button>
    <button class="btn" id="print-store">Print this store</button>
  </div>
  <div class="pickrow"><span class="plabel" id="lbl-store">Store</span><span id="stores"></span></div>
  <div class="pickrow"><span class="plabel" id="lbl-sheet">Sheet</span><span id="picks"></span></div>
</header>

<div class="shell">
  <main class="sheetwrap" id="stack"></main>
  <aside class="rail" id="rail">
    <div class="rail-h"><b id="rail-title">Screenshots</b><span id="rail-sub"></span></div>
    <div class="dropzone" id="dropzone"><span id="dz-text"></span>
      <input type="file" id="filepick" accept="image/*" multiple hidden></div>
    <div class="lib" id="lib"></div>
  </aside>
</div>

<script id="app-state" type="application/json">{"v":1,"custom":{},"sheets":{}}</script>

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function att(s){ return esc(s).replace(/"/g,"&quot;"); }
function fmt(s){
  return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="ui">$1</span>')
               .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function t(k){ return UI[lang][k]; }
function txt(v){ return typeof v === "string" ? v : v[lang]; }
function fill(s, vals){ return s.replace(/\{(\w+)\}/g, function(_, k){ return vals[k]; }); }
function forStore(c){ return SHEETS.filter(function(S){ return S.store === c; }); }
function sheetById(id){ for(var i=0;i<SHEETS.length;i++) if(SHEETS[i].id===id) return SHEETS[i]; return null; }
function storeName(c){
  for(var i=0;i<STORES.length;i++) if(STORES[i].code===c) return txt(STORES[i].name);
  return c;
}
function img(k){ return FIG[k] || STATE.custom[k] || null; }
function sheetState(id){
  if(!STATE.sheets[id]) STATE.sheets[id] = { type:"auto", steps:{} };
  if(!STATE.sheets[id].steps) STATE.sheets[id].steps = {};
  return STATE.sheets[id];
}
/* An override wins over the built-in default, including an override that says
   "no picture here" — otherwise a removed image would come straight back. */
function shotFor(S, n){
  var ov = (STATE.sheets[S.id] && STATE.sheets[S.id].steps || {})[String(n)];
  if(ov !== undefined) return (ov && ov.k && img(ov.k)) ? ov : null;
  var defs = (S.kind === "man" ? S.src.manual.shots : S.src.proc.shots) || {};
  var k = defs[n];
  return (k && img(k)) ? { k:k, size:img(k).def } : null;
}
function setShot(id, n, val){
  var st = sheetState(id);
  st.steps[String(n)] = val;
  dirty = true;
}

/* ------------------------------------------------------------------ render */
function stepsHtml(S, list, kind){
  return '<div class="steps">' + list.map(function(s, i){
    var n = i + 1;
    var sh = kind === "after" ? null : shotFor(S, n);
    var body = '<span class="n">' + n + '</span><p>' + fmt(s) + '</p>';
    if(sh){
      var im = img(sh.k);
      /* aspect-ratio comes from the stored pixel size, so a sheet measures the
         same before the images decode as after — the page-fit check depends on it */
      body += '<div class="shot"><img src="' + im.d + '" alt="" style="width:' + sh.size
            + '%;aspect-ratio:' + im.w + '/' + im.h + '">'
            + (canEdit ? '<div class="tools">'
                + '<span>' + t("size") + '</span>'
                + '<input type="range" min="18" max="100" step="2" value="' + sh.size + '" data-size="' + att(S.id) + '|' + n + '">'
                + '<span class="pct">' + sh.size + '%</span>'
                + '<button data-drop-img="' + att(S.id) + '|' + n + '">' + esc(t("remove")) + '</button>'
              + '</div>' : '')
            + '</div>';
    } else if(canEdit && kind !== "after"){
      body += '<div class="slot">' + esc(t("slot")) + '</div>';
    }
    return '<div class="step" data-slot="' + att(S.id) + '|' + n + '">' + body + '</div>';
  }).join("") + '</div>';
}

var PAGE_PX = 279 * 3.7795;   /* Letter height in CSS px at 96dpi */

/* "auto" hunts for the largest type that still fits; a number is the size you
   chose, and the badge tells you the truth either way. */
function fitSheet(S){
  var el = document.getElementById("sheet-" + S.id);
  if(!el) return 0;
  var st = sheetState(S.id);
  var wasH = el.style.height, wasM = el.style.minHeight;
  el.style.height = "auto";
  el.style.minHeight = "0";      /* the on-screen page-height floor would hide every overflow */
  el.classList.add("measuring"); /* and the drop slots are not printed */
  var size;
  if(st.type === "auto"){
    size = 9;
    for(var s = 13; s >= 9; s -= 0.2){
      el.style.fontSize = s + "pt";
      if(el.offsetHeight <= PAGE_PX * 0.985){ size = s; break; }
    }
  } else {
    size = st.type;
  }
  el.style.fontSize = size + "pt";
  var h = el.offsetHeight;
  el.classList.remove("measuring");
  el.style.height = wasH; el.style.minHeight = wasM;
  return { size:Math.round(size * 10) / 10, over:h > PAGE_PX };
}

function sheetBar(S, fit){
  var st = sheetState(S.id);
  var auto = st.type === "auto";
  return '<div class="sheetbar">'
    + '<span class="lbl">' + esc(t("typeSize")) + '</span>'
    + '<input type="range" min="9" max="13" step="0.2" value="' + fit.size + '" id="typesize">'
    + '<span class="pct" id="typepct">' + fit.size + ' pt</span>'
    + '<button class="btn" id="typeauto"' + (auto ? ' disabled' : '') + '>' + esc(t("auto")) + '</button>'
    + '<button class="btn" id="sheetreset">' + esc(t("reset")) + '</button>'
    + '<span class="fitbadge ' + (fit.over ? "over" : "ok") + '">'
    + (fit.over ? "⚠ " + esc(t("fitOver")) : "✓ " + esc(t("fitOk"))) + '</span>'
    + '</div>';
}

  Object.keys(FIG).forEach(function(k){
    var parts = k.split("|"), who = parts[0].replace(/^pos:/, "").replace(/^manual:/, "");
    var g = who + (parts[0].indexOf("manual:") === 0 ? " · " + t("manPick") : "");
    if(!groups[g]){ groups[g] = []; order.push(g); }
    groups[g].push({ k:k, n:parts[2] });
  });
  var customKeys = Object.keys(STATE.custom);
  if(customKeys.length){ groups[t("yours")] = customKeys.map(function(k){ return { k:k, n:"" }; }); order.unshift(t("yours")); }

  return order.map(function(g){
    return '<div class="libgroup"><div class="gh">' + esc(g) + '</div><div class="grid">'
      + groups[g].map(function(o){
          var im = img(o.k);
          return '<button class="thumb' + (used[o.k] ? " used" : "") + '" draggable="true" data-fig="' + att(o.k) + '">'
               + '<img src="' + im.d + '" alt="" draggable="false">'
               + '<span class="cap">' + esc(o.n ? t("step") + " " + o.n : "—") + '</span></button>';
        }).join("")
      + '</div></div>';
  }).join("");
}

function render(){
  document.documentElement.lang = lang;
  if(!forStore(store).some(function(S){ return S.id === sheet; })) sheet = forStore(store)[0].id;

  document.getElementById("lbl-store").textContent = t("store");
  document.getElementById("lbl-sheet").textContent = t("sheet");
  document.getElementById("print-one").textContent = t("saveOne");
  document.getElementById("print-store").textContent = t("printStore") + " (" + forStore(store).length + ")";
  document.getElementById("save").textContent = t("save");
  document.getElementById("rail-title").textContent = t("railTitle");
  document.getElementById("rail-sub").textContent = t("railSub");
  document.getElementById("dz-text").textContent = t("dz");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("lang-fr").setAttribute("aria-pressed", lang === "fr");

  document.getElementById("stores").innerHTML = STORES.map(function(S){
    return '<button class="chip st" data-store="' + S.code + '" aria-pressed="' + (S.code === store) + '">'
         + esc(S.code) + ' · ' + esc(txt(S.name)) + '</button>';
  }).join(" ");
  document.getElementById("picks").innerHTML = forStore(store).map(function(S){
    return '<button class="chip pick' + (S.kind === "man" ? " man" : "") + '" data-sheet="' + S.id
         + '" aria-pressed="' + (S.id === sheet) + '">' + esc(S.pos)
         + '<small>' + esc(S.kind === "man" ? t("manPick") : t("posPick")) + '</small></button>';
  }).join(" ");

  var stack = document.getElementById("stack");
  stack.innerHTML = '<div id="barslot"></div>' + SHEETS.map(sheetHtml).join("");

  /* measure every sheet laid out, then hide the ones not selected */
  var all = stack.querySelectorAll(".sheet"), fits = {};
  all.forEach(function(el){ el.classList.add("active"); });
  SHEETS.forEach(function(S){ fits[S.id] = fitSheet(S); });
  all.forEach(function(el){ if(el.id !== "sheet-" + sheet) el.classList.remove("active"); });

  var S = sheetById(sheet);
  document.getElementById("barslot").outerHTML = canEdit ? sheetBar(S, fits[sheet]) : "";
  document.getElementById("lib").innerHTML = libHtml();
}

/* ------------------------------------------------------------------- saving */
function buildDoc(){
  var css = document.getElementById("app-css").textContent;
  var figs = document.getElementById("app-figs").textContent;
  var js = document.getElementById("app-js").textContent;
  var lean = { v:STATE.v, custom:STATE.custom, sheets:{} };
  Object.keys(STATE.sheets).forEach(function(id){
    var st = STATE.sheets[id];
    if(st.type !== "auto" || Object.keys(st.steps || {}).length) lean.sheets[id] = st;
  });
  var state = JSON.stringify(lean).replace(/</g, "\\u003c");
  return "<!doctype html>\n<html lang=\"" + lang + "\">\n<head>\n<meta charset=\"utf-8\">\n"
    + "<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n"
    + "<title>Refund Sheet Builder<\/title>\n"
    + FONTS
    + "<style id=\"app-css\">" + css + "<\/style>\n</head>\n<body>\n"
    + SKELETON
    + "<script id=\"app-state\" type=\"application/json\">" + state + "<\/script>\n"
    + "<script id=\"app-figs\">" + figs + "<\/script>\n"
    + "<script id=\"app-js\">" + js + "<\/script>\n</body>\n</html>\n";
}

function note(kind, msg){
  var el = document.getElementById("savenote");
  el.className = "savenote " + kind;
  el.textContent = msg;
}

function save(){
  if(!artifactApi) return;
  note("", t("saving"));
  artifactApi.publish(buildDoc()).then(function(){
    dirty = false;
    note("ok", t("saved"));
    setTimeout(function(){ note("", ""); }, 2600);
  }).catch(function(err){
    var c = err && (err.code || err.name) || "";
    if(c === "conflict") return;                       /* someone else won; the view reloads */
    if(c === "not_granted" || c === "not_writer"){ canEdit = false; render(); note("", t("readonly")); return; }
    note("err", t("saveErr"));
  });
}

/* --------------------------------------------------------------- interaction */
function addCustom(file, then){
  var r = new FileReader();
  r.onload = function(){
    var probe = new Image();
    probe.onload = function(){
      var ar = probe.width / probe.height;
      var k = "custom:" + Date.now() + ":" + Math.round(Math.random() * 1e6);
      STATE.custom[k] = { d:r.result, w:probe.width, h:probe.height,
        def: ar >= 1.6 ? 78 : ar >= 1 ? 62 : ar >= 0.7 ? 44 : 32 };
      dirty = true;
      then(k);
    };
    probe.src = r.result;
  };
  r.readAsDataURL(file);
}

function dropOnStep(target, key){
  var bits = target.split("|");
  setShot(bits[0], +bits[1], { k:key, size:img(key).def });
  render();
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("button");
  if(!el) return;
  if(el.dataset.store){ store = el.dataset.store; render(); window.scrollTo(0, 0); return; }
  if(el.dataset.sheet){ sheet = el.dataset.sheet; render(); window.scrollTo(0, 0); return; }
  if(el.dataset.dropImg){
    var b = el.dataset.dropImg.split("|");
    setShot(b[0], +b[1], { k:null });
    render(); return;
  }
  if(el.id === "lang-en"){ lang = "en"; render(); return; }
  if(el.id === "lang-fr"){ lang = "fr"; render(); return; }
  if(el.id === "print-one"){ print("print-one"); return; }
  if(el.id === "print-store"){ print("print-store"); return; }
  if(el.id === "save"){ save(); return; }
  if(el.id === "typeauto"){ sheetState(sheet).type = "auto"; dirty = true; render(); return; }
  if(el.id === "sheetreset"){ delete STATE.sheets[sheet]; dirty = true; render(); return; }
});

/* Sliders update the picture live; a full redraw would fight the drag. */
document.addEventListener("input", function(ev){
  var el = ev.target;
  if(el.dataset && el.dataset.size){
    var b = el.dataset.size.split("|"), v = +el.value;
    var cur = shotFor(sheetById(b[0]), +b[1]);
    if(!cur) return;
    setShot(b[0], +b[1], { k:cur.k, size:v });
    var wrap = el.closest(".shot");
    wrap.querySelector("img").style.width = v + "%";
    wrap.querySelector(".pct").textContent = v + "%";
    return;
  }
  if(el.id === "typesize"){
    sheetState(sheet).type = +el.value;
    dirty = true;
    document.getElementById("typepct").textContent = (+el.value).toFixed(1) + " pt";
    var S = sheetById(sheet), f = fitSheet(S);
    var badge = document.querySelector(".fitbadge");
    badge.className = "fitbadge " + (f.over ? "over" : "ok");
    badge.textContent = f.over ? "⚠ " + t("fitOver") : "✓ " + t("fitOk");
    document.getElementById("typeauto").disabled = false;
  }
});
/* Re-measure once the drag ends, so the badge is honest again. */
document.addEventListener("change", function(ev){
  if(ev.target.dataset && ev.target.dataset.size) render();
});

document.addEventListener("dragstart", function(ev){
  var th = ev.target.closest(".thumb");
  if(!th) return;
  ev.dataTransfer.setData("text/fig", th.dataset.fig);
  ev.dataTransfer.effectAllowed = "copy";
});
document.addEventListener("dragover", function(ev){
  var st = ev.target.closest(".step[data-slot]");
  if(!st || !canEdit) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "copy";
  st.classList.add("drop");
});
document.addEventListener("dragleave", function(ev){
  var st = ev.target.closest(".step[data-slot]");
  if(st) st.classList.remove("drop");
});
document.addEventListener("drop", function(ev){
  var st = ev.target.closest(".step[data-slot]");
  if(!st || !canEdit) return;
  ev.preventDefault();
  st.classList.remove("drop");
  var key = ev.dataTransfer.getData("text/fig");
  if(key && img(key)) return dropOnStep(st.dataset.slot, key);
  var f = ev.dataTransfer.files && ev.dataTransfer.files[0];
  if(f && /^image\//.test(f.type)) addCustom(f, function(k){ dropOnStep(st.dataset.slot, k); });
});

(function railDrop(){
  var dz = document.getElementById("dropzone"), fp = document.getElementById("filepick");
  dz.addEventListener("click", function(){ fp.click(); });
  fp.addEventListener("change", function(){
    Array.prototype.forEach.call(fp.files, function(f){ addCustom(f, function(){ render(); }); });
    fp.value = "";
  });
  ["dragenter","dragover"].forEach(function(t){
    dz.addEventListener(t, function(ev){ ev.preventDefault(); dz.classList.add("over"); });
  });
  ["dragleave","drop"].forEach(function(t){
    dz.addEventListener(t, function(ev){ ev.preventDefault(); dz.classList.remove("over"); });
  });
  dz.addEventListener("drop", function(ev){
    Array.prototype.forEach.call(ev.dataTransfer.files || [], function(f){
      if(/^image\//.test(f.type)) addCustom(f, function(){ render(); });
    });
  });
})();

function print(mode){
  document.body.classList.remove("print-one", "print-store");
  if(mode) document.body.classList.add(mode);
  window.print();
  setTimeout(function(){ document.body.classList.remove("print-one", "print-store"); }, 0);
}
window.addEventListener("afterprint", function(){
  document.body.classList.remove("print-one", "print-store");
});
window.addEventListener("beforeunload", function(ev){
  if(dirty && canEdit){ ev.preventDefault(); ev.returnValue = ""; }
});

render();
/* Re-measure once everything has decoded, in case a browser lays out late. */
window.addEventListener("load", function(){ render(); });

/* Editing only lights up where the page can actually save itself. */
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("artifact").then(function(api){
    if(!api) return;
    artifactApi = api;
    canEdit = true;
    document.getElementById("save").hidden = false;
    render();
  }).catch(function(){});
}
</script>

</body>
</html>
