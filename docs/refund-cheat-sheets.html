<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refund Cheat Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ---------------------------------------------------------------------------
   One sheet per store per system. A manager at Cathcart should never read a
   line that only applies to Trois-Rivières, so nothing is combined: the sheet
   names one store, one POS, and the one terminal sitting in front of them.

   Built for a laser printer and a wall. Hierarchy comes from weight and rule
   rather than colour, so a photocopy reads the same as the original.
--------------------------------------------------------------------------- */

:root{
  --paper:#ffffff;
  --ink:#16181c;
  --ink-2:#4a5058;
  --ink-3:#7c828b;
  --rule:#c9cdd4;
  --rule-2:#e6e8ec;
  --band:#f2f3f5;
  --go:#0b6b3a;          /* the POS refund: how it is supposed to work */
  --fallback:#8a4b08;    /* the manual backup: only when the first way fails */
  --stop:#a81e1e;        /* the two or three traps that cost money */

  --app-bg:#eceef1;
  --app-ink:#20242a;
  --app-ink-2:#5a616a;
  --app-line:#d3d7dd;
  --app-surface:#ffffff;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --app-bg:#14171b; --app-ink:#e8eaee; --app-ink-2:#9aa1ab;
    --app-line:#2c3138; --app-surface:#1c2026;
  }
}
:root[data-theme="dark"]{
  --app-bg:#14171b; --app-ink:#e8eaee; --app-ink-2:#9aa1ab;
  --app-line:#2c3138; --app-surface:#1c2026;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--app-bg); color:var(--app-ink);
  font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ------------------------------------------------------------------ chrome */
.chrome{
  position:sticky; top:0; z-index:10; background:var(--app-surface);
  border-bottom:1px solid var(--app-line); padding:11px clamp(12px,3vw,26px);
  display:flex; flex-direction:column; gap:9px;
}
.crow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.chrome h1{
  margin:0; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; font-weight:700; letter-spacing:-.01em; white-space:nowrap;
}
.chrome h1 span{display:block; font-size:11px; font-weight:500; color:var(--app-ink-2)}
.pickrow{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.plabel{
  font:600 10px/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--app-ink-2); min-width:52px;
}
.chip{
  font:600 13px/1 "IBM Plex Sans",Arial,sans-serif; color:var(--app-ink-2);
  background:transparent; border:1px solid var(--app-line); border-radius:999px;
  padding:8px 14px; cursor:pointer;
}
.chip:hover{color:var(--app-ink)}
.chip[aria-pressed="true"]{background:var(--app-ink); border-color:var(--app-ink); color:var(--app-surface)}
.chip.sys[aria-pressed="true"]{background:var(--go); border-color:var(--go); color:#fff}
.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--go); outline-offset:2px}
.spacer{margin-left:auto}
.seg{display:inline-flex; border:1px solid var(--app-line); border-radius:8px; overflow:hidden}
.seg button{
  font:600 12px/1 "IBM Plex Mono",monospace; padding:8px 11px;
  background:transparent; color:var(--app-ink-2); border:0; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--app-ink); color:var(--app-surface)}
.btn{
  font:600 13px/1 "IBM Plex Sans",Arial,sans-serif; padding:9px 15px;
  border-radius:8px; border:1px solid var(--app-line); background:transparent;
  color:var(--app-ink); cursor:pointer;
}
.btn.primary{background:var(--go); border-color:var(--go); color:#fff}
.btn:hover{border-color:var(--app-ink-2)}
.btn.primary:hover{background:#095a30}
.hint{
  padding:8px clamp(12px,3vw,26px); font-size:12px; color:var(--app-ink-2);
  background:var(--app-surface); border-bottom:1px solid var(--app-line); margin:0;
}

/* ------------------------------------------------------------------- paper */
.stack{padding:20px clamp(8px,3vw,26px) 60px; display:flex; flex-direction:column; align-items:center; gap:20px}
.sheet{
  width:216mm; max-width:100%;
  background:var(--paper); color:var(--ink);
  padding:12mm 12mm 10mm;
  box-shadow:0 1px 2px rgba(0,0,0,.10), 0 10px 30px rgba(0,0,0,.12);
  display:none; flex-direction:column;
  font-size:10.2pt; line-height:1.33;
}
.sheet.active{display:flex; height:279mm}

/* masthead ---------------------------------------------------------------- */
.mast{display:flex; align-items:flex-start; gap:14px; border-bottom:2.5px solid var(--ink); padding-bottom:6px}
.eyebrow{
  font:600 8pt/1 "IBM Plex Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
}
.mast h2{
  margin:2px 0 0; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:25pt; font-weight:700; line-height:.95; letter-spacing:-.02em;
}
.mast-r{margin-left:auto; text-align:right; display:flex; flex-direction:column; gap:3px; align-items:flex-end}
.storecode{
  font-family:Archivo,sans-serif; font-size:19pt; font-weight:700; line-height:1;
  border:2px solid var(--ink); border-radius:3px; padding:2px 8px;
}
.kit{font:500 8.2pt/1.3 "IBM Plex Mono",monospace; color:var(--ink-2); max-width:64mm}

/* blocks ------------------------------------------------------------------ */
.block{margin-top:8px}
.block-h{display:flex; align-items:baseline; gap:8px; padding-bottom:4px}
.block-h .num{
  font-family:Archivo,sans-serif; font-weight:700; font-size:10.5pt; line-height:1;
  width:21px; height:21px; border-radius:50%; display:grid; place-items:center;
  color:#fff; flex:none;
}
.block-h h3{
  margin:0; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:13pt; font-weight:700; letter-spacing:-.01em; line-height:1;
}
.block-h .when{font:500 8.8pt/1 "IBM Plex Sans",Arial,sans-serif; color:var(--ink-2); margin-left:auto; text-align:right}
.go .num{background:var(--go)} .go h3{color:var(--go)} .go .block-h{border-bottom:1.5px solid var(--go)}
.fb .num{background:var(--fallback)} .fb h3{color:var(--fallback)} .fb .block-h{border-bottom:1.5px solid var(--fallback)}

.applies{
  margin-top:5px; padding:4px 8px; border-left:3px solid var(--go); background:#f1f6f3;
  font-size:9.2pt; line-height:1.32;
}
.mh{
  font:600 9pt/1.2 "IBM Plex Sans",Arial,sans-serif; margin-top:5px;
  padding-bottom:3px; border-bottom:1px solid var(--rule);
}
.cols{columns:2; column-gap:7mm; column-rule:1px solid var(--rule-2); margin-top:5px}
.step{break-inside:avoid; display:flex; gap:6px; padding:2.3px 0}
.step .n{
  font:600 8.2pt/1.55 "IBM Plex Mono",monospace; color:var(--ink-3);
  min-width:12px; flex:none; font-variant-numeric:tabular-nums;
}
.step p{margin:0}

/* figures ------------------------------------------------------------------
   Screenshots are orientation, not reading matter: they answer "am I on the
   right screen?" at arm's length. The full-size version lives in the app. */
.figs{display:grid; gap:4mm; margin-top:6px; justify-content:center}
.figs[data-n="1"]{grid-template-columns:minmax(0,23em)}
.figs[data-n="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.figs[data-n="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.fig{border:1px solid var(--rule); background:var(--band); display:flex; flex-direction:column; min-width:0}
.fig img{width:100%; object-fit:contain; object-position:center; display:block; background:#fff}
.figs[data-n="1"] .fig img{height:11em}
.figs[data-n="2"] .fig img{height:10.5em}
.figs[data-n="3"] .fig img{height:8.6em}
.fig figcaption{
  font:600 7.6pt/1.25 "IBM Plex Mono",monospace; color:var(--ink-2);
  padding:2.5px 5px; border-top:1px solid var(--rule); background:var(--band);
}
.fig figcaption b{color:var(--ink); font-weight:600}

.trap{
  break-inside:avoid; margin:5px 0 0; padding:5px 8px 5px 9px;
  border-left:3px solid var(--stop); background:#fbf3f3;
}
.trap .lbl{
  font:600 7.6pt/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--stop); display:block; margin-bottom:2.5px;
}
.after{break-inside:avoid; margin-top:6px; padding:6px 9px; background:var(--band); border-left:3px solid var(--ink-2)}
.after .lbl{
  font:600 7.6pt/1 "IBM Plex Mono",monospace; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-2); display:block; margin-bottom:3px;
}
.after .step .n{color:var(--ink-2)}
.none{margin-top:5px; padding:8px 10px; border:1px dashed var(--rule); color:var(--ink-2); font-size:9.4pt}
.none b{color:var(--ink)}

/* every-refund rules, identical on all ten sheets on purpose --------------- */
.rules{margin-top:auto; padding-top:7px; border-top:2.5px solid var(--ink)}
.rules-h{
  font:600 8pt/1 "IBM Plex Mono",monospace; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:4px;
}
.rules ol{margin:0; padding:0; list-style:none; counter-reset:r; display:grid; grid-template-columns:repeat(4,1fr); gap:0 5mm}
.rules li{font-size:8.9pt; line-height:1.28; padding-left:12px; position:relative}
.rules li::before{
  content:counter(r); counter-increment:r; position:absolute; left:0; top:0;
  font:600 7.8pt/1.45 "IBM Plex Mono",monospace; color:var(--ink-3);
}
.foot{
  display:flex; gap:10px; align-items:baseline; margin-top:6px;
  font:500 7.6pt/1.3 "IBM Plex Mono",monospace; color:var(--ink-3);
}
.foot .r{margin-left:auto}

.ui{
  font-family:"IBM Plex Mono",monospace; font-size:.92em; font-weight:500;
  background:var(--band); border:1px solid var(--rule-2); border-radius:3px;
  padding:.5px 3.5px; white-space:nowrap;
}
strong{font-weight:600}

/* ------------------------------------------------------------------- print */
@page{size:letter portrait; margin:11mm}
@media print{
  :root{--app-bg:#fff}
  body{background:#fff}
  .chrome,.hint{display:none !important}
  .stack{padding:0; gap:0; display:block}
  .sheet{
    display:flex !important; width:auto; max-width:none; height:auto;
    padding:0; box-shadow:none; break-after:page; page-break-after:always;
  }
  .sheet.active{height:auto}
  .sheet:last-of-type{break-after:auto; page-break-after:auto}
  body.print-one .sheet:not(.active){display:none !important}
  body.print-one .sheet.active{break-after:auto; page-break-after:auto}
  body.print-store .sheet:not(.in-store){display:none !important}
  body.print-store .sheet.in-store:last-of-type{break-after:auto; page-break-after:auto}
  .applies,.trap,.after,.ui,.fig,.fig figcaption,.block-h .num,.storecode{
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<header class="chrome">
  <div class="crow">
    <h1>Refund cheat sheets<span id="brand-sub">FUNHUB</span></h1>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-fr" aria-pressed="false">FR</button>
    </div>
    <button class="btn primary" id="print-one">Save as PDF</button>
    <button class="btn" id="print-store">Print this store</button>
  </div>
  <div class="pickrow"><span class="plabel" id="lbl-store">Store</span><span id="stores"></span></div>
  <div class="pickrow"><span class="plabel" id="lbl-sys">System</span><span id="systems"></span></div>
</header>
<p class="hint" id="hint"></p>

<main class="stack" id="stack"></main>

  trap:{ en:"Intercard is a hybrid: the POS drives the terminal, but **you key the amount yourself**. Nothing is pulled from the original sale.",
         fr:"Intercard est hybride : le PDV pilote le terminal, mais **vous tapez le montant vous-même**. Rien n'est repris de la vente." },
  noManual:{ en:"There is **no separate manual procedure** on these terminals. The steps above already are the hand-keyed refund.",
             fr:"Il n'y a **aucune procédure manuelle distincte** sur ces terminaux. Les étapes ci-dessus sont déjà le remboursement saisi à la main." }
};

var MIDORI_AFTER = {
  note:{ en:"Midori does not know about a manual refund. The sale stays marked paid until you do this.",
         fr:"Midori ignore un remboursement manuel. La vente reste payée tant que ceci n'est pas fait." },
  steps:{
    en:[ "Reopen the sale → [[Refund]].",
         "Check the amount matches the terminal.",
         "Note: **manual refund on the terminal** + the refund receipt number. Press [[Refund]]." ],
    fr:[ "Rouvrez la vente → [[Refund]].",
         "Vérifiez que le montant correspond au terminal.",
         "Note : **remboursement manuel sur le terminal** + le numéro du reçu. Appuyez sur [[Refund]]." ] }
};

/* ---- one sheet per store per system -------------------------------------- */
var SHEETS = [
  { store:"03", pos:"Midori",    kit:"Clover Flex · Clover Mini", proc:MIDORI,    manual:CLOVER,  after:MIDORI_AFTER },
  { store:"03", pos:"MYR",       kit:"Moneris Go Plus",           proc:MYR,       manual:MONERIS },
  { store:"03", pos:"Intercard", kit:"Moneris P400",              proc:INTERCARD, manual:null },

  { store:"07", pos:"Midori",    kit:"Moneris Go",                proc:MIDORI,    manual:MONERIS, after:MIDORI_AFTER },
  { store:"07", pos:"Cluster",   kit:"Moneris Go Plus",           proc:CLUSTER,   manual:MONERIS },
  { store:"07", pos:"Embed",     kit:"Windcave LANE3600",         proc:EMBED,     manual:null },

  { store:"11", pos:"Midori",    kit:"Moneris Go",                proc:MIDORI,    manual:MONERIS, after:MIDORI_AFTER },
  { store:"11", pos:"MYR",       kit:"Moneris Go Plus",           proc:MYR,       manual:MONERIS },
  { store:"11", pos:"Embed",     kit:"Windcave LANE3600",         proc:EMBED,     manual:null },

  { store:"HO", pos:"Embed",     kit:"Windcave CHU200S",          proc:EMBED,     manual:null }
];

var RULES = {
  en:[ "Refund to the **same card** the customer paid with. Never another card, never cash.",
       "Print the receipt. The customer **signs the merchant copy**.",
       "Signed merchant copy goes in the **nightly deposit**.",
       "The customer keeps **their own copy**." ],
  fr:[ "Remboursez sur la **même carte** que le paiement. Jamais une autre, jamais comptant.",
       "Imprimez le reçu. Le client **signe la copie marchand**.",
       "La copie marchand signée va au **dépôt de fin de journée**.",
       "Le client garde **sa propre copie**." ]
};

/* ------------------------------------------------------------------ render */
var lang = "en", store = "03", system = "Midori";

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="ui">$1</span>')
               .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function t(k){ return UI[lang][k]; }
function txt(v){ return typeof v === "string" ? v : v[lang]; }
function id(S){ return S.store + "-" + S.pos; }
function forStore(c){ return SHEETS.filter(function(S){ return S.store === c; }); }
function storeName(c){
  for(var i=0;i<STORES.length;i++) if(STORES[i].code===c) return txt(STORES[i].name);
  return c;
}
function steps(list){
  return list.map(function(s,i){
    return '<div class="step"><span class="n">'+(i+1)+'</span><p>'+fmt(s)+'</p></div>';
  }).join("");
}
function figs(list){
  if(!list || !list.length) return "";
  var out = list.filter(function(f){ return FIG[f.k]; });
  if(!out.length) return "";
  return '<div class="figs" data-n="' + out.length + '">' + out.map(function(f){
    return '<figure class="fig"><img src="'+FIG[f.k]+'" alt=""><figcaption><b>'
         + esc(t("step")) + ' ' + f.s + '</b></figcaption></figure>';
  }).join("") + '</div>';
}
function trap(v){
  return '<div class="trap"><span class="lbl">'+esc(t("trap"))+'</span>'+fmt(txt(v))+'</div>';
}

function sheetHtml(S){
  var P = S.proc, active = id(S) === (store + "-" + system);
  var h = '<section class="sheet'+(active?" active":"")+(S.store===store?" in-store":"")+'" id="sheet-'+id(S)+'">';

  h += '<div class="mast"><div>'
     + '<div class="eyebrow">'+esc(t("cycle"))+' · '+esc(storeName(S.store))+'</div>'
     + '<h2>'+esc(S.pos)+'</h2></div>'
     + '<div class="mast-r"><span class="storecode">'+esc(S.store)+'</span>'
     + '<span class="kit">'+esc(S.kit)+'</span></div></div>';

  h += '<div class="block go"><div class="block-h"><span class="num">1</span><h3>'
     + esc(t("integrated"))+'</h3><span class="when">'+esc(t("whenInt"))+'</span></div>'
     + (P.applies ? '<div class="applies">'+fmt(txt(P.applies))+'</div>' : '')
     + '<div class="cols">'+steps(P.steps[lang])+'</div>'
     + figs(P.figs)
     + (P.trap ? trap(P.trap) : '')
     + '</div>';

  h += '<div class="block fb"><div class="block-h"><span class="num">2</span><h3>'
     + esc(t("manual"))+'</h3><span class="when">'+esc(t("whenMan"))+'</span></div>';
  if(S.manual){
    h += '<div class="mh">'+esc(S.manual.name)+'</div>'
       + '<div class="cols">'+steps(S.manual.steps[lang])+'</div>'
       + figs(S.manual.figs)
       + trap(S.manual.trap);
    if(S.after){
      h += '<div class="after"><span class="lbl">'+esc(t("after"))+'</span>'
         + '<p style="margin:0 0 3px;color:var(--ink-2)">'+esc(txt(S.after.note))+'</p>'
         + '<div class="cols">'+steps(S.after.steps[lang])+'</div></div>';
    }
  } else {
    h += '<div class="none">'+fmt(txt(P.noManual))+'</div>';
  }
  h += '</div>';

  h += '<div class="rules"><div class="rules-h">'+esc(t("rules"))+'</div><ol>'
     + RULES[lang].map(function(r){ return '<li>'+fmt(r)+'</li>'; }).join("")
     + '</ol><div class="foot"><span>'+esc(t("foot"))+'</span>'
     + '<span class="r">'+esc(S.store)+' · '+esc(S.pos)+' · '+esc(t("rev"))+'</span></div></div>';

  return h + '</section>';
}

/* A sheet with a short manual section would otherwise print as a third of a
   page of white. Grow the type until the paper is nearly full, capped so
   nothing ever spills onto a second page. */
function fit(){
  var page = 279 * 3.7795;          /* Letter height in CSS px at 96dpi */
  SHEETS.forEach(function(S){
    var el = document.getElementById("sheet-" + id(S));
    if(!el) return;
    /* Measure the natural height: with the sheet at its fixed page height the
       footer's auto margin eats the slack and every size looks like a fit. */
    el.style.height = "auto";
    /* Kept to a narrow band on purpose: a printed pack where one sheet is 9pt
       and the next is 14pt reads as a mistake. */
    var best = 9.2;
    for(var size = 12.4; size >= 9.2; size -= 0.2){
      el.style.fontSize = size + "pt";
      if(el.offsetHeight <= page * 0.985){ best = size; break; }
    }
    el.style.fontSize = best + "pt";
    el.style.height = "";
  });
}

function render(){
  document.documentElement.lang = lang;
  if(!forStore(store).some(function(S){ return S.pos === system; })) system = forStore(store)[0].pos;

  document.getElementById("hint").textContent = t("hint");
  document.getElementById("lbl-store").textContent = t("store");
  document.getElementById("lbl-sys").textContent = t("system");
  document.getElementById("print-one").textContent = t("saveOne");
  document.getElementById("print-store").textContent = t("printStore") + " (" + forStore(store).length + ")";
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  document.getElementById("lang-fr").setAttribute("aria-pressed", lang === "fr");

  document.getElementById("stores").innerHTML = STORES.map(function(S){
    return '<button class="chip st" data-store="'+S.code+'" aria-pressed="'+(S.code===store)+'">'
         + esc(S.code) + ' · ' + esc(txt(S.name)) + '</button>';
  }).join(" ");
  document.getElementById("systems").innerHTML = forStore(store).map(function(S){
    return '<button class="chip sys" data-sys="'+esc(S.pos)+'" aria-pressed="'+(S.pos===system)+'">'
         + esc(S.pos) + '</button>';
  }).join(" ");

  var stack = document.getElementById("stack");
  stack.innerHTML = SHEETS.map(sheetHtml).join("");

  /* measure with everything laid out, then hide what is not selected */
  var all = stack.querySelectorAll(".sheet");
  all.forEach(function(el){ el.classList.add("active"); });
  fit();
  all.forEach(function(el){ if(el.id !== "sheet-" + store + "-" + system) el.classList.remove("active"); });
}

function print(mode){
  document.body.classList.remove("print-one", "print-store");
  if(mode) document.body.classList.add(mode);
  window.print();
  setTimeout(function(){ document.body.classList.remove("print-one", "print-store"); }, 0);
}

document.addEventListener("click", function(ev){
  var el = ev.target.closest("button");
  if(!el) return;
  if(el.dataset.store){ store = el.dataset.store; render(); window.scrollTo(0,0); return; }
  if(el.dataset.sys){ system = el.dataset.sys; render(); window.scrollTo(0,0); return; }
  if(el.id === "lang-en"){ lang = "en"; render(); return; }
  if(el.id === "lang-fr"){ lang = "fr"; render(); return; }
  if(el.id === "print-one"){ print("print-one"); return; }
  if(el.id === "print-store"){ print("print-store"); return; }
});
window.addEventListener("afterprint", function(){
  document.body.classList.remove("print-one", "print-store");
});

render();
</script>

</body>
</html>
